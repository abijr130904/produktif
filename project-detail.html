<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./dist/output.css">
  <title>Detail Project</title>
</head>

<body class="bg-slate-100 text-dark">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md shadow fixed top-0 left-0 w-full z-50">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html"
        class="font-semibold text-primary hover:text-teal-700 transition">
        ← Kembali
      </a>

      <h1 class="font-bold text-lg">
        Detail Project
      </h1>
    </div>
  </header>

  <main class="pt-28 pb-20">

    <div class="container mx-auto px-4 max-w-6xl">

      <!-- SLIDER -->
      <div class="bg-white p-5 mb-8">

        <div class="relative">

          <div class="bg-slate-100 p-4">

            <img
              id="mainImage"
              alt="Dokumentasi Project"
              class="w-full max-h-[700px] object-contain mx-auto transition-all duration-300">

          </div>

          <button
            id="prevBtn"
            class="absolute left-3 top-1/2 -translate-y-1/2 bg-white w-12 h-12 hover:scale-110 transition rounded-full shadow">
            ❮
          </button>

          <button
            id="nextBtn"
            class="absolute right-3 top-1/2 -translate-y-1/2 bg-white w-12 h-12 hover:scale-110 transition rounded-full shadow">
            ❯
          </button>

        </div>

        <!-- Thumbnail -->
        <div
          id="thumbnailContainer"
          class="flex gap-3 overflow-x-auto mt-4 pb-2">
        </div>

      </div>

      <!-- Judul -->
      <div class="mb-8">

        <h1
          id="projectTitle"
          class="text-4xl font-bold mb-3">
        </h1>

        <div
          id="projectTags"
          class="flex flex-wrap gap-2">
        </div>

      </div>

      <!-- Content -->
      <div class="grid lg:grid-cols-3 gap-6">

        <!-- Kiri -->
        <div class="lg:col-span-2 space-y-6">

          <!-- Deskripsi -->
          <div class="bg-white shadow p-6">

            <h2 class="text-2xl font-bold mb-4">
              Tentang Project
            </h2>

            <p
              id="projectDesc"
              class="text-secondary leading-8 text-justify">
            </p>

          </div>

          <!-- ============= PERAN ============= -->
          <div class="bg-white shadow p-6">

            <h2 class="text-2xl font-bold mb-4 text-indigo-600">
              👤 Peran Saya
            </h2>

            <p
              id="projectRole"
              class="text-lg font-semibold text-gray-700 bg-indigo-50 px-4 py-3 rounded-lg inline-block">
            </p>

          </div>

          <!-- ============= KONTRIBUSI ============= -->
          <div class="bg-white shadow p-6">

            <h2 class="text-2xl font-bold mb-4 text-indigo-600">
              📋 Kontribusi
            </h2>

            <ul
              id="projectContributions"
              class="space-y-3">
            </ul>

          </div>

          <!-- Fitur -->
          <div class="bg-white shadow p-6">

            <h2 class="text-2xl font-bold mb-4">
              ✅ Fitur Utama
            </h2>

            <ul
              id="projectFeatures"
              class="space-y-3">
            </ul>

          </div>

          <!-- Teknologi -->
          <div class="bg-white shadow p-6">

            <h2 class="text-2xl font-bold mb-4">
              🛠️ Teknologi Digunakan
            </h2>

            <div
              id="projectTools"
              class="flex flex-wrap gap-3">
            </div>

          </div>

        </div>

        <!-- Kanan -->
        <div class="space-y-6">

          <!-- Detail -->
          <div class="bg-white shadow p-6">

            <h2 class="text-xl font-bold mb-4">
              📌 Detail Project
            </h2>

            <div class="space-y-4">

              <div>
                <p class="text-secondary text-sm">
                  📅 Tanggal
                </p>

                <p
                  id="projectDate"
                  class="font-semibold">
                </p>
              </div>

              <div>
                <p class="text-secondary text-sm">
                  🏷️ Kategori
                </p>

                <p
                  id="projectCategory"
                  class="font-semibold">
                </p>
              </div>

              <div>
                <p class="text-secondary text-sm">
                  📌 Status
                </p>

                <p
                  id="projectStatus"
                  class="font-semibold">
                </p>
              </div>

            </div>

          </div>

          <!-- Aksi -->
          <div class="bg-white shadow p-6">

            <h2 class="text-xl font-bold mb-4">
              🔗 Tautan
            </h2>

            <div class="flex flex-col gap-3">

              <a
                id="githubLink"
                target="_blank"
                class="flex items-center justify-center gap-2 text-center py-3 px-4 rounded-xl border border-slate-300 hover:bg-slate-100 transition"
              >
                <!-- GitHub Icon -->
                <svg role="img" width="20" class="fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <title>GitHub</title>
                  <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.744.083-.729.083-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.334-5.466-5.931 0-1.31.469-2.381 1.235-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23a11.5 11.5 0 0 1 3.003-.404c1.018.005 2.042.137 3.003.404 2.292-1.552 3.3-1.23 3.3-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.804 5.625-5.475 5.921.43.372.823 1.103.823 2.222v3.293c0 .319.218.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>

                <span class="font-medium">Source Code</span>
              </a>

              <a
                id="demoLink"
                target="_blank"
                class="text-center py-3 rounded-xl border border-slate-300 hover:bg-slate-100 transition">
                🚀 Demo
              </a>

              <a
                id="reportLink"
                target="_blank"
                class="text-center py-3 rounded-xl bg-primary text-white hover:opacity-90 transition">
                📄 Lihat Laporan Project
              </a>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

  <script src="data/projects.js"></script>
  <script src="dist/js/detail.js"></script>

</body>
</html>
